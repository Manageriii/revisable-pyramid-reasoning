[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyramid-reasoning"
version = "0.1.0"
description = "Revisable Pyramid Reasoning (RPR) experimental research prototype for Apple Silicon MLX models."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mlx>=0.24.0",
    "mlx-vlm>=0.7.11",
    "mlx-lm>=0.22.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
